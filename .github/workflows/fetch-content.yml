# 内容与 AI 知识自动抓取 - 定时工作流
# 每 6 小时检查最新消息；AI 知识来源按照数据库中的抓取间隔运行。
# 需预先在仓库 Settings -> Secrets 配置：
#   SUPABASE_URL / SUPABASE_SECRET_KEY / AI_EMBEDDING_API_KEY
name: 抓取校园新内容

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 忽略来源间隔，立即检查全部已启用来源
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: content-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests beautifulsoup4 supabase

      - name: 检查官网正文提取规则
        run: python scripts/test_crawl_knowledge.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取最新消息列表
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/fetch_feeds.py

      - name: 抓取 AI 官方知识（默认进入待审核）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CRAWL_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: python scripts/crawl_knowledge.py

      - name: 为已审核知识补充向量
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AI_EMBEDDING_API_KEY: ${{ secrets.AI_EMBEDDING_API_KEY }}
          AI_EMBEDDING_API_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
          AI_EMBEDDING_MODEL: text-embedding-v4
          AI_EMBEDDING_DIMENSIONS: '1024'
        run: |
          if [ -z "$AI_EMBEDDING_API_KEY" ]; then
            echo "未配置 AI_EMBEDDING_API_KEY，跳过向量补充。"
            exit 0
          fi
          node scripts/reindex_knowledge.mjs
